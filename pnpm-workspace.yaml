packages:
  - 'frontend'
  - 'backend'

# pnpm 10+ บล็อก build script ของ dependency โดยค่าเริ่มต้น
# Prisma ต้องรัน postinstall เพื่อเตรียม engine จึงต้องอนุญาตไว้
allowBuilds:
  '@parcel/watcher': true
  '@prisma/engines': true
  # swagger-ui-dist ใช้ scarf ส่ง telemetry ตอน install — ไม่อนุญาต
  '@scarf/scarf': false
  prisma: true
  sharp: true
  unrs-resolver: true
